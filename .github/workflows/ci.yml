# Build and test the core and the app on Windows and Linux.
# release.yml packages and publishes; this only checks.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: 1.95.0
  ZIG_VERSION: 0.16.0
  CARGO_PROFILE_DEV_DEBUG: "1"
  CARGO_PROFILE_TEST_DEBUG: "1"
  CARGO_INCREMENTAL: "0"
  HC_TEST_WATCHDOG_S: "120"
  HC_TEST_SLOW_RUNNER: "1"

jobs:
  core-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core-lint
          cache-bin: false
      - run: cargo fmt --all -- --check
      - run: mkdir -p vendor/ghostty
      - run: cargo clippy --locked --target x86_64-pc-windows-msvc --all-targets -- -D warnings
        env:
          ZIG: ${{ github.workspace }}/core/scripts/zig-stub.sh

  core-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-latest, target: x86_64-unknown-linux-musl, threads: 4 }
          - { os: windows, runner: windows-2022, target: x86_64-pc-windows-msvc, threads: 2 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
          targets: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
          key: core-${{ matrix.target }}
          cache-workspace-crates: true
          cache-bin: false
      - run: cargo clippy --locked --target ${{ matrix.target }} --all-targets -- -D warnings
      - if: matrix.os == 'windows'
        shell: pwsh
        run: scripts/fetch-conpty.ps1 -Dest target/${{ matrix.target }}/debug
      - name: Tests
        shell: bash
        run: cargo test --locked --no-fail-fast --target ${{ matrix.target }} -- --test-threads ${{ matrix.threads }}

  app-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-22.04 }
          - { platform: windows-x86_64, runner: windows-2022 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: app-${{ matrix.platform }}
          cache-workspace-crates: true
          cache-bin: false
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          scripts/ci-apt \
            pkg-config clang libclang-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
      - name: Pick packages
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            echo "PKGS=-p swarmux -p swarmux-shell" >>"$GITHUB_ENV"
          else
            echo "PKGS=-p swarmux" >>"$GITHUB_ENV"
          fi
      - name: Tests
        run: |
          only=()
          if [ "$RUNNER_OS" != Linux ]; then
            for t in tests/*.rs; do
              name=$(basename "$t" .rs)
              [ "$name" = shot_pixels ] || only+=(--test "$name")
            done
            only+=(--bins)
          fi
          threads=()
          if [ "$RUNNER_OS" = Linux ]; then
            threads=(-- --test-threads 4)
          fi
          cargo test --locked $PKGS \
            --config 'profile.dev.package."*".opt-level=0' \
            --config 'profile.dev.package.swarmux-shell.opt-level=0' \
            "${only[@]}" "${threads[@]}"
      - name: Check release packaging
        if: runner.os == 'Linux'
        run: python3 -m unittest discover -s scripts -p test_distribution.py

  ci-ok:
    needs: [core-lint, core-test, app-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[ "${{ needs.core-lint.result }}" = success ] && [ "${{ needs.core-test.result }}" = success ] && [ "${{ needs.app-test.result }}" = success ]'
